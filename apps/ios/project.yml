name: Waffled
options:
  bundleIdPrefix: ru.familydiary
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Waffled:
    type: application
    platform: iOS
    sources:
      - path: Sources/Waffled/App/WaffledApp.swift
      - path: Sources/Waffled/App/AppRoot.swift
      - path: Sources/Waffled/FamilyDiary
      - path: Sources/Waffled/Resources
    info:
      path: Waffled-Info.plist
      properties:
        CFBundleDisplayName: Семья
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [ru]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.familydiary.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_TESTABILITY: YES
    scheme:
      testTargets: [WaffledTests, WaffledUITests]
      gatherCoverageData: true
  WaffledTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TestsLocal
      - path: CoreTests
    dependencies:
      - target: Waffled
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.familydiary.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Waffled.app/Waffled"
        BUNDLE_LOADER: "$(TEST_HOST)"
  WaffledUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Waffled
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.familydiary.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Waffled
