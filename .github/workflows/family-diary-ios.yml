name: Family Diary iOS
on:
  push:
    branches: [family-diary-local]
    paths: ['apps/ios/**', '.github/workflows/family-diary-ios.yml']
  pull_request:
    paths: ['apps/ios/**', '.github/workflows/family-diary-ios.yml']
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build for iPhone
        working-directory: apps/ios
        run: xcodebuild -project Waffled.xcodeproj -scheme Waffled -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test on simulator
        working-directory: apps/ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for group in d.values() for x in group if "iPhone" in x["name"]))')
          xcodebuild -project Waffled.xcodeproj -scheme Waffled -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO test
